# Included by nginx.conf in every location that sets its own add_header
# (nginx does not inherit add_header into a location that declares one).
#
# CSP is strict because the page is static: no inline script, no inline style
# attribute, no third-party origin. Fonts, images, CSS and JS are all 'self'.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Add Strict-Transport-Security at the TLS terminator (ingress / host server block), not here:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
