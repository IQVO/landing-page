# IQVO landing page: static site, container flavour (nginx-unprivileged, port 8080).
# Real files only: a missing path is a 404, never an SPA fallback.
# /healthz is a static file baked by the Dockerfile for probes.
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # directory URLs without a slash redirect to a relative Location, so the redirect survives the TLS edge in front
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # css/js are content-hashed by scripts/build.mjs, so they can be immutable.
    location ~* "^/assets/(css|js)/.+\.[0-9a-f]{8}\.(css|js)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # fonts and images keep stable names: long but not immutable.
    location ~* ^/assets/(fonts|img)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|svg|ico|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # the document itself always revalidates, so a deploy is visible immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
