# Example for a host-installed nginx (no container). Copy the built site to
# /var/www/iqvo (rsync -a --delete dist/ server:/var/www/iqvo/) and:
#   sudo cp deploy/security-headers.conf /etc/nginx/snippets/security-headers.conf
#   sudo cp deploy/nginx-host.example.conf /etc/nginx/sites-available/iqvo.conf
#   sudo ln -s /etc/nginx/sites-available/iqvo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (certbot --nginx, or your ingress) is deliberately out of scope here.

server {
    listen 80;
    listen [::]:80;
    server_name iqvo.example.com;        # <- your hostname
    # return 301 https://$host$request_uri;   # enable once TLS is in place
    root /var/www/iqvo;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/security-headers.conf; }
    location = /healthz { access_log off; default_type text/plain; add_header Cache-Control "no-store" always; }

    location ~* "^/assets/(css|js)/.+\.[0-9a-f]{8}\.(css|js)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* ^/assets/(fonts|img)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
